# Codecov configuration
# https://docs.codecov.com/docs/codecovyml-reference

coverage:
  precision: 2
  round: down
  range: "60...100"
  status:
    project:
      default:
        target: auto
        threshold: 5%
        informational: true  # Don't fail PR checks
    patch:
      default:
        target: 60%
        informational: true  # Don't fail PR checks

parsers:
  gcov:
    branch_detection:
      conditional: yes
      loop: yes
      method: no
      macro: no

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: true

ignore:
  - "**/__tests__/**"
  - "**/dist/**"
  - "**/node_modules/**"
  - "**/*.test.ts"
  - "**/*.spec.ts"
